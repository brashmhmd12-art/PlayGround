<!doctype html>
<html lang="ar" dir="rtl" data-theme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>MOHAMMAD ABRASH — Command Center | محمد ابراش</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>A</text></svg>">
</head>
<body>
<div id="boot" class="boot"><div class="boot-card"><div class="logo">A</div><div class="boot-name">MOHAMMAD ABRASH</div><div class="boot-sub">Command Center · محمد ابراش</div><div class="loader"></div></div></div>

<div id="authView" class="auth-wrap hidden">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="logo lg">A</div>
    <h1>MOHAMMAD ABRASH</h1>
    <p class="muted">Personal Digital Command Center · نظامك الشخصي الخاص</p>
    <div class="tabs"><button id="tabLogin" class="tab active">دخول</button><button id="tabSignup" class="tab">حساب جديد</button></div>
    <form id="loginForm" autocomplete="off">
      <label data-i18n="user">المستخدم / البريد</label><input id="liUser" required maxlength="120" autocomplete="username">
      <label data-i18n="pass">كلمة المرور</label><input id="liPass" type="password" required autocomplete="current-password">
      <label data-i18n="otp">رمز المصادقة (TOTP إن فُعّل)</label><input id="liOtp" inputmode="numeric" maxlength="6" placeholder="—">
      <button class="btn primary" type="submit" data-i18n="enter">دخول آمن</button>
      <p id="loginMsg" class="msg"></p>
    </form>
    <form id="signupForm" class="hidden" autocomplete="off">
      <label>Username</label><input id="suUser" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.\-]+">
      <label>Email</label><input id="suEmail" type="email" required maxlength="120">
      <label data-i18n="pass">كلمة المرور (12+ حرف)</label><input id="suPass" type="password" required minlength="12" autocomplete="new-password">
      <button class="btn primary" type="submit">إنشاء الهوية</button>
      <p id="signupMsg" class="msg"></p>
    </form>
    <p class="fine">PBKDF2 · Rate-limit · Audit · <span data-i18n="nolock">لا ندّعي عدم الاختراق — ممارسات أمنية بأقل صلاحيات</span></p>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand"><div class="logo">A</div><div class="brand-t"><b>MOHAMMAD ABRASH</b><span>محمد ابراش · OS</span></div>
      <button id="collapseBtn" title="طي">⇤</button></div>
    <div class="side-search"><button id="paletteBtn" class="palette-trigger">⌘K · <span data-i18n="search">بحث / أمر</span></button></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="netBadge" class="net">● Online</div><button id="logoutBtn" class="btn ghost">خروج</button></div>
  </aside>
  <div class="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="crumb"><b id="crumbTitle">Command Center</b><span id="clock" class="muted"></span></div>
      <div class="top-actions">
        <button id="langBtn" class="icon-btn" title="AR/EN">ع/E</button>
        <button id="themeBtn" class="icon-btn" title="theme">◐</button>
        <button id="vaultLockBtn" class="icon-btn" title="vault">🔒</button>
        <img id="avatar" class="avatar" alt="me">
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="palette" class="palette hidden"><div class="pal-box">
  <input id="palInput" placeholder="CTRL+K — ابحث أو اكتب أمرًا… / Search or command…">
  <div id="palList"></div>
</div></div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="modal-box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="m-actions"><button id="mOk" class="btn primary">تأكيد</button><button id="mCancel" class="btn ghost">إلغاء</button></div></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
